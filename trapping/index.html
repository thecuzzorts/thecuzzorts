<body>

  <header class="site-header">
    <p class="site-title"><a class="home-link" href="../index.html">The Cuzzorts</a> &mdash; Trapping</p>
    <p class="site-tagline">Josh's Illinois furbearer trapping log</p>
    <div role="navigation">
      <nav>
        <ul>
          <li><a href="#species">Species</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <div class="page-intro">
      <h1>Trapping</h1>
      <p>Working the trapline &mdash; Illinois furbearer season runs through the winter months, tracking every legally trappable species</p>
    </div>

    <!-- Quick-glance totals -- same treatment as /fishing's and /hunting's
         stats-strip, placed right after the intro rather than in its own
         nav-linked Overview section (which used to repeat this same
         number inside a bigger progress-bar card). -->
    <div class="stats-strip">
      <div class="stat"><span class="stat-num" id="trappingTrappedTotal">0</span><span class="stat-label">Species Trapped</span></div>
      <div class="stat"><span class="stat-num" id="trappingRemainingTotal">0</span><span class="stat-label">Remaining</span></div>
    </div>

    <!-- Species -->
    <div class="section-panel" id="species">
      <h3 class="section-heading">Species</h3>
      <p class="species-subtitle" id="speciesSubtitle"></p>
      <div class="species-sort-toggle" id="speciesSortToggle">
        <button class="species-sort-btn active" data-sort="alphabetical">Alphabetical</button>
        <button class="species-sort-btn" data-sort="taxonomic">Taxonomic</button>
        <button class="species-sort-btn" data-sort="habitat">Habitat</button>
        <button class="species-sort-btn" data-sort="size">Size</button>
        <button class="species-sort-btn" data-sort="trapped">Trapped</button>
      </div>
      <div class="species-grid" id="speciesGrid"></div>
    </div>

  </main>
