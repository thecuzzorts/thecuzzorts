name: planes

# Collects positions for the aircraft in planes/data/aircraft.json and keeps
# planes.json and flight tracks on the planes-data branch for /planes to read.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planes-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            planes/data
            .github/scripts/planes

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out planes-data
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" planes-data >/dev/null; then
            git clone --quiet --depth 1 --branch planes-data "$remote" planes-data-checkout
          else
            git init --quiet planes-data-checkout
            git -C planes-data-checkout remote add origin "$remote"
          fi
          git -C planes-data-checkout config user.name "github-actions[bot]"
          git -C planes-data-checkout config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect
        run: node .github/scripts/planes/collect.mjs --data planes-data-checkout --seconds 285 --interval 30 --push
